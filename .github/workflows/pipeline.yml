name: Secure-CI-Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # GATE 1: Static analysis + secrets for the Python backend
  # ---------------------------------------------------------------------------
  lint-and-shield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Tools
        run: pip install ruff bandit

      - name: Code Cleanliness (Ruff)
        run: ruff check .

      - name: Security Audit (Bandit)
        run: bandit -r src/ -v

      - name: Check for vulnerable dependencies
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          pip install safety
          safety --key "$SAFETY_API_KEY" scan

  # ---------------------------------------------------------------------------
  # GATE 2: Licenses + SBOM for the Python backend
  # ---------------------------------------------------------------------------
  legal-licenses-checks:
    needs: lint-and-shield
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: License Compliance Check
        run: |
          pip-licenses --summary
          pip-licenses --allow-only "MIT;Apache;BSD;Python;ISC;PSF;Unlicense;MPL 2.0;Mozilla Public License 2.0 (MPL 2.0)" --partial-match

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt --output-format json --output-file bom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials-python
          path: bom.json

  # ---------------------------------------------------------------------------
  # GATE 3: Backend unit tests with 100% coverage
  # ---------------------------------------------------------------------------
  logic-and-coverage:
    needs: legal-licenses-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests with 100% Coverage
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest --cov=src --cov-report=term-missing --cov-fail-under=100

      - name: Generate HTML Report
        run: pytest --cov=src --cov-report=html

      - name: Upload Coverage Result
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: htmlcov/

  # ---------------------------------------------------------------------------
  # GATE 4: Secrets scan (repo-wide)
  # ---------------------------------------------------------------------------
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # GATE 5: Dockerfile linting for both images
  # ---------------------------------------------------------------------------
  docker-lint:
    name: Docker Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint API Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.api
          failure-threshold: info

      - name: Lint Web Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile
          failure-threshold: info

  # ---------------------------------------------------------------------------
  # GATE 6: Terraform infrastructure scan
  # ---------------------------------------------------------------------------
  infra-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./infra
          framework: terraform
          soft_fail: false

  # ---------------------------------------------------------------------------
  # GATE 7: Deep infrastructure security audit
  # ---------------------------------------------------------------------------
  infra-security-scan:
    needs: infra-scan
    name: "Infrastructure Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./infra
          framework: terraform
          quiet: true
          soft_fail: false
          download_external_modules: true

  # ---------------------------------------------------------------------------
  # GATE 8: Frontend lint + unit tests + coverage
  # ---------------------------------------------------------------------------
  web-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Unit tests with coverage (>= 90%)
        run: npm run test:coverage

      - name: Upload web coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: web/coverage/

  # ---------------------------------------------------------------------------
  # GATE 9: Frontend audit + licenses + SBOM
  # ---------------------------------------------------------------------------
  web-supply-chain:
    needs: web-lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit (high/critical)
        run: npm audit --audit-level=high --omit=dev

      - name: License check
        run: npm run licenses

      - name: Generate SBOM
        run: npm run sbom

      - name: Upload web SBOM
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials-web
          path: web/sbom.json

  # ---------------------------------------------------------------------------
  # GATE 10: Container image CVE scan (Trivy)
  # ---------------------------------------------------------------------------
  image-scan:
    name: "Container Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: docker-lint
    steps:
      - uses: actions/checkout@v6

      - name: Build API image
        run: docker build -t resolution-api -f Dockerfile.api .

      - name: Build Web image
        run: docker build -t resolution-web -f web/Dockerfile ./web

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: resolution-api
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Scan Web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: resolution-web
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  # ---------------------------------------------------------------------------
  # GATE 11: DAST scan via docker compose (api + web)
  # ---------------------------------------------------------------------------
  dast-scan:
    name: "Dynamic Security Scan (ZAP)"
    runs-on: ubuntu-latest
    needs: [image-scan, logic-and-coverage, web-lint-and-test]
    steps:
      - uses: actions/checkout@v6

      - name: Generate ephemeral secrets
        run: |
          python -c "from cryptography.fernet import Fernet; print('ENCRYPTION_KEY=' + Fernet.generate_key().decode())" > .env
          echo "OLLAMA_MODEL=tinyllama" >> .env
          echo "CHECKIN_HOURS=9" >> .env
          echo "OLLAMA_URL=http://localhost:11434" >> .env
        shell: bash

      - name: Build images
        run: |
          docker build -t resolution-api -f Dockerfile.api .
          docker build -t resolution-web -f web/Dockerfile ./web

      - name: Start services
        run: |
          # Skip ollama-init pull during DAST; mock LLM not required for scan.
          docker compose up -d --no-deps api web
          echo "Waiting for API..."
          timeout 60s sh -c 'until curl -sSf http://localhost:8080/api/health > /dev/null; do sleep 2; done'
          echo "Waiting for Web..."
          timeout 60s sh -c 'until curl -sSf http://localhost:5173/ > /dev/null; do sleep 2; done'

      - name: Prepare ZAP workspace
        run: |
          mkdir -p .zap
          printf "10049\tIGNORE\tFalse positive: app enforces no-store headers in middleware\n" > .zap/rules.tsv
          printf "10055\tIGNORE\tunsafe-inline required for Tailwind and React inline styles\n" >> .zap/rules.tsv
          printf "10109\tIGNORE\tInformational only: ZAP flags all SPAs as modern web apps\n" >> .zap/rules.tsv
          printf "90003\tIGNORE\tSRI not applicable for self-hosted Vite build artifacts\n" >> .zap/rules.tsv
          sudo chmod -R 777 .

      - name: OWASP ZAP Baseline Scan (API)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: 'zap-scan-api'
          fail_action: true

      - name: Reset report file permissions
        if: always()
        run: sudo chmod -R 777 .

      - name: OWASP ZAP Baseline Scan (Web)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:5173'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: 'zap-scan-web'
          fail_action: true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolution-tracker-security-reports
          path: |
            report_html.html
            report_md.md
          retention-days: 5
